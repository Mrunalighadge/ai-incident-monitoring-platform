global:
  scrape_interval: 15s
  scrape_timeout: 15s

scrape_configs:

  - job_name: 'ai-engine'
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-engine-46dm.onrender.com

  - job_name: 'payment-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - payment-service-n9ds.onrender.com

  - job_name: 'notification-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - notification-service-s13m.onrender.com

  - job_name: 'database-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - database-service-m88z.onrender.com

  - job_name: 'auth-service'
    metrics_path: /metrics
    static_configs:
    - targets: ['auth-service-1zh0.onrender.com']