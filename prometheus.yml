global:
  scrape_interval: 15s
  scrape_timeout: 15s

scrape_configs:

  - job_name: 'ai-engine'
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-engine-69a7.onrender.com

  - job_name: 'payment-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - payment-service-cqbe.onrender.com

  - job_name: 'notification-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - notification-service-c1gx.onrender.com

  - job_name: 'database-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - database-service-1ys1.onrender.com

  - job_name: 'auth-service'
    metrics_path: /metrics
    static_configs:
    - targets: ['auth-service-opu2.onrender.com']