version: "3"

services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    volumes:
      - ./app/data:/app/data

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"