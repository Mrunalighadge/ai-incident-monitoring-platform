global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'auth-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:5001']

  - job_name: 'payment-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['payment-service:5002']

  - job_name: 'notification-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-service:5003']

  - job_name: 'database-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['database-service:5004']

  - job_name: 'ai-engine'
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-engine:5005']

  - job_name: 'security-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['security-exporter:8000']