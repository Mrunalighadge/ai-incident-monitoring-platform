global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'payment-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - payment-service-cqbe.onrender.com
    scheme: https

  - job_name: 'notification-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - notification-service-c1gx.onrender.com
    scheme: https

  - job_name: 'database-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - database-service-1ys1.onrender.com
    scheme: https

  - job_name: 'ai-engine'
    scrape_interval: 30s
    scrape_timeout: 15s

    metrics_path: /metrics

    static_configs:
      - targets:
          - ai-engine-69a7.onrender.com

    scheme: https